name: Deploy to Dev

# Deploys every push to main to dev.career.vtk.be, but only once CI has passed
# for that exact commit.
#
# elise.vtk.be cannot be reached over SSH from GitHub, so this job runs on a
# self-hosted runner installed on elise itself. The runner must carry the
# "elise" label, and its service user needs docker access and permission to
# `git fetch` in APP_DIR.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

# Never run two deploys at once; a newer one waits rather than cancelling a
# deploy that may be halfway through a migration.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, elise]
    env:
      # The dev checkout on elise, with its own .env (DEV_ENVIRONMENT=true).
      APP_DIR: /home/it/career-prisma
      # Deploy the commit CI tested, not whatever main points to by now.
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Deploy
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          git fetch --all
          git reset --hard "$SHA"

          # Same sequence as production -- see deploy-production.yml for why
          # the migration runs before the new image starts.
          docker compose up -d database
          docker compose --profile tools run --rm --build migration
          docker compose up -d --build
