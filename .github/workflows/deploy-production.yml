name: Deploy to Production

# Manual only: Actions tab -> "Deploy to Production" -> Run workflow (on main).
# Deploys the commit main points to at the moment it is started, and refuses
# unless CI passed for that exact commit.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Only deploy main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys only from main (got ${{ github.ref }})."
          exit 1

      - name: Check CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" \
            --jq '.total_count')
          if [ "$passed" -eq 0 ]; then
            echo "::error::No successful CI run for ${{ github.sha }}. Wait for CI to finish (or fix it) before deploying."
            exit 1
          fi
          echo "CI passed for ${{ github.sha }}."

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy through SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /home/it/career-prisma &&
            git fetch --all &&

            # The verified commit, not origin/main: something pushed after this
            # run started has not been checked by the verify job.
            git reset --hard ${{ github.sha }} &&

            # Bring the database up first so migrations have something to run
            # against. The app is still serving the previous image at this point.
            docker compose up -d database &&

            # Apply any new Prisma migrations before the new image starts, so
            # the code never boots against a schema it does not expect. The
            # one-off 'migration' service runs 'prisma migrate deploy'; it is
            # behind the 'tools' profile so a plain 'up' never starts it.
            # 'migrate deploy' only applies migrations the database has not seen
            # yet, so re-running it on a deploy with no new migration is a no-op.
            # A failure aborts the chain here and the old image keeps serving.
            #
            # Note the ordering trade-off: the schema changes a moment before
            # the new code does, so a migration that DROPS or RENAMES something
            # the current image still reads will break requests for the few
            # minutes the build takes. Ship those in two deploys -- first the
            # code that stops using the column, then the migration that drops it.
            docker compose --profile tools run --rm --build migration &&

            # Build and restart Docker container
            docker compose up -d --build
          "
