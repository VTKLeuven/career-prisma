services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DIRECTUS_URL: ${DIRECTUS_URL}
        NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-${DIRECTUS_URL}}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    # REMOVED the 'ports' mapping here so they don't clash on the host when scaling
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_DIRECTUS_URL=${NEXT_PUBLIC_DIRECTUS_URL:-${DIRECTUS_URL}}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
    restart: unless-stopped
    env_file:
      - .env
    # Scale to 8 replicas (leaves your remaining 8 cores for Directus, DB, and OS)
    deploy:
      mode: replicated
      replicas: 8
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      - net.core.somaxconn=8192
      - net.ipv4.tcp_tw_reuse=1

  # The Load Balancer handles the host port mapping and distributes traffic
  loadbalancer:
    image: caddy:2-alpine
    ports:
      # Maps external 3002 to internal 80
      - "3002:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Caddy acts as a reverse proxy. Docker's internal DNS automatically
    # round-robins requests to 'app:3000' across all 8 replicas.
    command: caddy run --config /etc/caddy/Caddyfile
    restart: unless-stopped
    depends_on:
      - app
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.tcp_tw_reuse=1