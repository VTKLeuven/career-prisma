version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Docker Compose automatically reads .env file for variable substitution
        DIRECTUS_URL: ${DIRECTUS_URL}
        NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-${DIRECTUS_URL}}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_DIRECTUS_URL=${NEXT_PUBLIC_DIRECTUS_URL:-${DIRECTUS_URL}}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
    restart: unless-stopped
    env_file:
      - .env
    # Load test fixes: raise file descriptor limit (default 1024 is too low for 1000+ connections)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Kernel tuning for high connection load (requires Docker host to allow these)
    # If you get "permission denied" errors, set these on the host instead - see k6/README.md
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_tw_reuse=1
