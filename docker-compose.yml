services:
  # PostgreSQL replaces Directus entirely. Plain postgres, not postgis: the one
  # geometry column (career_event_page.location) is now latitude/longitude
  # floats, so the extension is no longer needed -- which also means this image
  # builds natively on arm64.
  database:
    image: postgres:16-alpine
    container_name: career-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-career}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed on the host for migrations and psql. Bound to loopback so the
      # database is never reachable from outside the machine.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career} -d ${POSTGRES_DB:-career}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    # No 'ports' mapping: the replicas would clash on the host port.
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # Inside the compose network the database is reachable by service name,
      # so this overrides whatever host-facing DATABASE_URL is in .env.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-career}?schema=public
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    # Scale to 8 replicas (leaves the remaining cores for Postgres and the OS)
    deploy:
      mode: replicated
      replicas: 8
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      - net.core.somaxconn=8192
      - net.ipv4.tcp_tw_reuse=1

  # The Load Balancer handles the host port mapping and distributes traffic
  loadbalancer:
    image: caddy:2-alpine
    ports:
      # Maps external 3002 to internal 80
      - "3002:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Caddy acts as a reverse proxy. Docker's internal DNS automatically
    # round-robins requests to 'app:3000' across all 8 replicas.
    command: caddy run --config /etc/caddy/Caddyfile
    restart: unless-stopped
    depends_on:
      - app
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.tcp_tw_reuse=1

volumes:
  db-data:
