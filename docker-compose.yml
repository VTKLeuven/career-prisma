services:
  # PostgreSQL replaces Directus entirely. Plain postgres, not postgis: the one
  # geometry column (career_event_page.location) is now latitude/longitude
  # floats, so the extension is no longer needed -- which also means this image
  # builds natively on arm64.
  database:
    image: postgres:16-alpine
    container_name: career-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-career}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed on the host for migrations and psql. Bound to loopback so the
      # database is never reachable from outside the machine.
      - "127.0.0.1:${POSTGRES_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career} -d ${POSTGRES_DB:-career}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
        # Only matters for routes that get prerendered; keep equal to the
        # runtime value below so the two can never disagree.
        DEV_ENVIRONMENT: ${DEV_ENVIRONMENT:-false}
    # Serve the single application container directly on the host.
    ports:
      - "${APP_PORT:-3003}:3000"
    environment:
      - NODE_ENV=production
      # Separate fields avoid corrupting a URL when the password contains
      # reserved characters such as @, #, /, ?, %, or :.
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-career}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB:-career}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - UPLOADS_DIR=/app/directus-uploads
      # The operative setting: the vacancy pages, server actions and API routes
      # all read this per request.
      - DEV_ENVIRONMENT=${DEV_ENVIRONMENT:-false}
    volumes:
      # Preserve UUID filenames from the old export; new uploads are written
      # here too.
      - ./uploads:/app/directus-uploads
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      - net.core.somaxconn=8192
      - net.ipv4.tcp_tw_reuse=1

  # One-off Prisma CLI container. The profile keeps it out of normal
  # `docker compose up`; the import script invokes it when needed.
  migration:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-career}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB:-career}
    depends_on:
      database:
        condition: service_healthy

volumes:
  db-data:
